# The unified client's crates: the shared wire protocol and the ROM interface (UC0), the melonDS
# core, the in-memory ROM step and the dev binary (UC1), the runtime and the game window (UC2),
# plus the relay on the shared protocol crate. Runs on pushes and pull requests that touch them.
name: Unified client

on:
  push:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "coop-relay/**", "hg-engine/include/coop_*.h", ".github/workflows/unified-client.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "coop-relay/**", "hg-engine/include/coop_*.h", ".github/workflows/unified-client.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # melonDS (crates/goldlink-core-sys/melonDS)
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          sudo apt-get update -q
          sudo apt-get install -y -q libclang-dev libasound2-dev libudev-dev
      - name: Workspace tests (melonDS builds with CMake; the tests that need a ROM stay ignored)
        run: cargo test --locked --workspace --exclude goldlink-abi-gen
      - name: The release program carries no dev code (DECISIONS D2)
        run: |
          if cargo tree --locked -p goldlink -e normal | grep -E 'goldlink-dev|mlua'; then
            echo "goldlink depends on dev code"; exit 1
          fi
      - name: Relay tests on the shared protocol crate
        run: cargo test --locked --manifest-path coop-relay/Cargo.toml
      - name: The ROM interface is up to date with hg-engine's headers (libclang)
        run: cargo run --locked -p goldlink-abi-gen -- --check

  # macOS (RFC §6 M7): the client as a universal .app (Apple silicon + Intel), ad-hoc signed.
  # Notarization needs the maintainer's Apple Developer ID (UC7.md), so Gatekeeper still asks
  # the first time (right-click > Open).
  macos:
    runs-on: macos-15 # macos-14 is retired: jobs on it are cancelled before they start
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          brew list cmake > /dev/null 2>&1 || brew install cmake
      - name: Tests (the ones without a ROM)
        run: cargo test --locked -p goldlink-core -p goldlink-runtime -p goldlink-bridge -p goldlink-rom -p goldlink
      - name: The universal app
        run: |
          cargo build --locked --release -p goldlink --target aarch64-apple-darwin
          cargo build --locked --release -p goldlink --target x86_64-apple-darwin
          app=build/GoldLink.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          # the app icon (scripts/launcher_art.py's 256 px goldlink.png, drawn at 32 px, so whole-pixel scales)
          set=build/GoldLink.iconset
          mkdir -p "$set" build/icon
          for n in 16 32 64 128 256; do
            sips -z $n $n crates/goldlink/assets/goldlink.png --out build/icon/$n.png > /dev/null
          done
          # iconutil takes only Apple's names: icon_<size>x<size>[@2x].png
          for n in 16 32 128 256; do cp build/icon/$n.png "$set/icon_${n}x${n}.png"; done
          for n in 16 32 128; do cp build/icon/$((n * 2)).png "$set/icon_${n}x${n}@2x.png"; done
          iconutil -c icns "$set" -o "$app/Resources/GoldLink.icns"
          lipo -create -output "$app/MacOS/GoldLink" \
            target/aarch64-apple-darwin/release/goldlink target/x86_64-apple-darwin/release/goldlink
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>GoldLink</string>
            <key>CFBundleExecutable</key><string>GoldLink</string>
            <key>CFBundleIconFile</key><string>GoldLink</string>
            <key>CFBundleIdentifier</key><string>io.github.eloyball.goldlink</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep -s - build/GoldLink.app
          lipo -info "$app/MacOS/GoldLink"
      - uses: actions/upload-artifact@v4
        with:
          name: GoldLink-macos-app
          path: build/GoldLink.app
