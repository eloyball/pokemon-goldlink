# The unified client's crates (dev/docs/unified-client, UC0). The relay stays a standalone package
# with its own Cargo.lock and target/ (its release scripts find it under coop-relay/target).
[workspace]
resolver = "3"
members = [
    "crates/goldlink-proto",
    "crates/goldlink-abi",
    "crates/goldlink-abi-gen",
    "crates/goldlink-rom",
    "crates/goldlink-core-sys",
    "crates/goldlink-core",
    "crates/goldlink-runtime",
    "crates/goldlink-bridge",
    "crates/goldlink",
    "crates/goldlink-dev",
    "crates/goldlink-sign",
]
# The generator needs bindgen; `cargo test` at the root builds everything else (melonDS needs
# CMake and a C++17 compiler).
default-members = [
    "crates/goldlink-proto",
    "crates/goldlink-abi",
    "crates/goldlink-rom",
    "crates/goldlink-core-sys",
    "crates/goldlink-core",
    "crates/goldlink-runtime",
    "crates/goldlink-bridge",
    "crates/goldlink",
    "crates/goldlink-dev",
    "crates/goldlink-sign",
]
exclude = ["coop-relay", "hg-engine"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
