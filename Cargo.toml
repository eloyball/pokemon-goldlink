[package]
name = "coop-relay"
version = "0.2.0"
edition = "2024"
description = "Multi-room 6-Player UDP relay server with persistent roster locking for Pokemon HeartGold"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["net", "time", "rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
