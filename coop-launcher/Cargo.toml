[package]
name = "goldlink-launcher"
version = "0.1.0"
edition = "2021"
description = "GoldLink: sets up and starts the co-op HeartGold game (docs/RELEASE_PLAN.md)"
license = "CC-BY-NC-SA-4.0"
publish = false

[[bin]]
name = "GoldLink"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # BizHawk's config needs "$type" first
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
dirs = "6"

# Windows draws with wgpu (Direct3D 12, with Windows' software adapter when there's no usable
# GPU) rather than OpenGL, which many Windows drivers, VMs and remote desktops lack.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu"] }
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
