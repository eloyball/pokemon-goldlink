[package]
name = "coop-relay"
version = "0.3.0"
edition = "2024"
description = "Multi-room 6-Player UDP relay server with persistent roster locking for Pokemon HeartGold"
license = "CC-BY-NC-SA-4.0"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
goldlink-proto = { path = "../crates/goldlink-proto" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["net", "time", "rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# QUIC (unified-client UC6): the optional encrypted listener (--quic).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
sha2 = "0.10"

[profile.release]
strip = true
