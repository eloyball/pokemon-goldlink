[package]
name = "goldlink-abi-gen"
version = "0.1.0"
description = "Generates goldlink-abi/src/generated.rs from hg-engine's co-op headers (needs libclang)"
license = "MIT OR CC-BY-NC-SA-4.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bindgen = "0.72"
syn = { version = "2", features = ["full", "visit-mut"] }
prettyplease = "0.2"
quote = "1"
