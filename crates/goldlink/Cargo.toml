[package]
name = "goldlink"
version = "0.1.0"
description = "GoldLink: six-player co-op Pokémon HeartGold in one program (the unified client)"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The workspace forbids unsafe code; here it's denied, so the one Win32 call (attaching to the
# console for --status / --setup) can be allowed where it is.
[lints.rust]
unsafe_code = "deny"

[lib]
path = "src/lib.rs"

[features]
# Development only (docs/DEBUG_TOOLS.md, dev_hooks.rs): GOLDLINK_DEBUG_LOSE_GPU loses the window's
# GPU device on purpose; GOLDLINK_DEV_INPUT clicks and presses keys on a headless display. Never in
# a release.
dev-hooks = ["goldlink-light/dev-hooks"]

[[bin]]
name = "goldlink"
path = "src/main.rs"

[dependencies]
goldlink-core = { path = "../goldlink-core" }
goldlink-runtime = { path = "../goldlink-runtime" }
goldlink-bridge = { path = "../goldlink-bridge" }
goldlink-proto = { path = "../goldlink-proto" }
goldlink-rom = { path = "../goldlink-rom" }
goldlink-light = { path = "../goldlink-light" }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
log = "0.4"
serde_json = "1"
ureq = "3"
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
dirs = "6"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
goldlink-sign = { path = "../goldlink-sign" }
goldlink-update = { path = "../goldlink-update" }
# The player's picture put together on the window's GPU (UC14, composite.rs).
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# wgpu on every OS (UC14: the lighting and shadows run on the GPU, written once in WGSL): Vulkan
# on Linux with wgpu's OpenGL fallback, Metal on macOS, Direct3D 12 on Windows (with Windows'
# software adapter when there's no usable GPU; many Windows drivers, VMs and remote desktops lack
# OpenGL).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies.eframe]
version = "0.31"
default-features = false
features = ["wgpu", "default_fonts", "wayland", "x11"]

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies.wgpu]
version = "24"
default-features = false
features = ["wgsl"]

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
wgpu = { version = "24", default-features = false, features = ["metal", "wgsl"] }

# rfd's file chooser there goes through the desktop portal on zbus over Tokio, which needs a
# runtime to drive it (launcher.rs `run_dialog`).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time"] }
# The screen kept on while a game shows (awake.rs): the desktop portal's Inhibit, rfd's ashpd.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }

[dev-dependencies]
serde_json = "1"
