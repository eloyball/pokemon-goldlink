[package]
name = "goldlink"
version = "0.1.0"
description = "GoldLink: six-player co-op Pokémon HeartGold in one program (the unified client)"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The workspace forbids unsafe code; here it's denied, so the one Win32 call (attaching to the
# console for --status / --setup) can be allowed where it is.
[lints.rust]
unsafe_code = "deny"

[lib]
path = "src/lib.rs"

[[bin]]
name = "goldlink"
path = "src/main.rs"

[dependencies]
goldlink-core = { path = "../goldlink-core" }
goldlink-runtime = { path = "../goldlink-runtime" }
goldlink-bridge = { path = "../goldlink-bridge" }
goldlink-proto = { path = "../goldlink-proto" }
goldlink-rom = { path = "../goldlink-rom" }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde_json = "1"
ureq = "3"
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
dirs = "6"

# The launcher's choices (coop-launcher/Cargo.toml): OpenGL on Linux and macOS; on Windows wgpu
# (Direct3D 12, with Windows' software adapter when there's no usable GPU), since many Windows
# drivers, VMs and remote desktops lack OpenGL.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }

[dev-dependencies]
serde_json = "1"
