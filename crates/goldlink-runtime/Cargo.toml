[package]
name = "goldlink-runtime"
version = "0.1.0"
description = "GoldLink's game runtime without a UI: the emulation thread, pacing, audio, per-world saves, backups, settings"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
goldlink-core = { path = "../goldlink-core" }
goldlink-abi = { path = "../goldlink-abi" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
cpal = "0.17"

[dev-dependencies]
goldlink-rom = { path = "../goldlink-rom" }
